name: Copy Kivi source assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-assets:
    if: ${{ !startsWith(github.event.head_commit.message, 'Copy Kivi source assets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy source PDFs
        run: |
          curl -L --fail https://raw.githubusercontent.com/sparkingcharms/kivi/main/Kivi%20wireframes.pdf -o 'Kivi wireframes.pdf'
          curl -L --fail https://raw.githubusercontent.com/sparkingcharms/kivi/main/Product%20Vision.pdf -o 'Product Vision.pdf'

      - name: Commit copied assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Kivi wireframes.pdf' 'Product Vision.pdf'
          git diff --cached --quiet || git commit -m 'Copy Kivi source assets'
          git push
