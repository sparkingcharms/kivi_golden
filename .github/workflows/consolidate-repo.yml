name: Consolidate repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Consolidate repository') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorganize repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend database resources docs/assets
          [ -d backend/kivi ] || git mv kivi backend/kivi
          [ -f backend/run.py ] || git mv run.py backend/run.py
          [ -f backend/manage.py ] || git mv manage.py backend/manage.py
          [ -f backend/verify.py ] || git mv verify.py backend/verify.py
          [ -d database/migrations ] || git mv migrations database/migrations
          [ -d resources/corpus ] || git mv corpus resources/corpus
          [ -f docs/RUN.md ] || git mv RUN.md docs/RUN.md
          [ -f docs/assets/'Kivi wireframes.pdf' ] || git mv 'Kivi wireframes.pdf' docs/assets/'Kivi wireframes.pdf'
          [ -f docs/assets/'Product Vision.pdf' ] || git mv 'Product Vision.pdf' docs/assets/'Product Vision.pdf'
          [ -f docs/PRODUCT_CONTEXT.md ] || git mv PRODUCT_CONTEXT.md docs/PRODUCT_CONTEXT.md

          cat > app.py <<'PY'
          #!/usr/bin/env python3
          """Start the local Kivi application."""
          import argparse
          import sys
          from pathlib import Path
          ROOT = Path(__file__).resolve().parent
          sys.path.insert(0, str(ROOT / "backend"))
          from kivi.api import app
          if __name__ == "__main__":
              parser = argparse.ArgumentParser()
              parser.add_argument("--port", type=int, default=8000)
              parser.add_argument("--host", default="127.0.0.1")
              args = parser.parse_args()
              print(f"Kivi on http://{args.host}:{args.port}")
              app.run(host=args.host, port=args.port, debug=False)
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          replacements = [
              (r'(?<!resources/)corpus/corpus\.jsonl', 'resources/corpus/corpus.jsonl'),
              (r'(?<!resources/)corpus/generate\.py', 'resources/corpus/generate.py'),
              (r'(?<!resources/)corpus/shortcuts\.json', 'resources/corpus/shortcuts.json'),
              (r'(?<!database/)migrations/', 'database/migrations/'),
              (r'python run\.py', 'python app.py'),
              (r'python manage\.py', 'python backend/manage.py'),
              (r'python verify\.py', 'python backend/verify.py'),
              (r'(?<!docs/)RUN\.md', 'docs/RUN.md'),
              (r'(?<!docs/)PRODUCT_CONTEXT\.md', 'docs/PRODUCT_CONTEXT.md'),
              (r'(?<!docs/assets/)Kivi wireframes\.pdf', 'docs/assets/Kivi wireframes.pdf'),
              (r'(?<!docs/assets/)Product Vision\.pdf', 'docs/assets/Product Vision.pdf'),
          ]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.py','.md','.yml','.yaml','.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              old = text
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)
              if text != old:
                  path.write_text(text, encoding='utf-8')

          p = Path('backend/kivi/config.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('ROOT = Path(__file__).resolve().parent.parent', 'ROOT = Path(__file__).resolve().parents[2]')
          p.write_text(text, encoding='utf-8')

          p = Path('backend/kivi/api.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('WEB = Path(__file__).resolve().parent.parent / "web"', 'WEB = Path(__file__).resolve().parents[2] / "web"')
          p.write_text(text, encoding='utf-8')

          p = Path('backend/kivi/db.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('MIGRATIONS_DIR = Path(__file__).resolve().parent.parent / "migrations"', 'MIGRATIONS_DIR = Path(__file__).resolve().parents[2] / "database" / "migrations"')
          p.write_text(text, encoding='utf-8')

          p = Path('evaluation/run_eval.py')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('sys.path.insert(0, str(ROOT))', 'sys.path.insert(0, str(ROOT / "backend"))')
              p.write_text(text, encoding='utf-8')

          for name in ('manage.py', 'verify.py'):
              p = Path('backend') / name
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('ROOT=Path(__file__).resolve().parent;', 'ROOT=Path(__file__).resolve().parent.parent;')
              text = text.replace('ROOT = Path(__file__).resolve().parent', 'ROOT = Path(__file__).resolve().parent.parent')
              text = text.replace('sys.path.insert(0,str(ROOT))', 'sys.path.insert(0,str(Path(__file__).resolve().parent))')
              text = text.replace('sys.path.insert(0, str(ROOT))', 'sys.path.insert(0, str(Path(__file__).resolve().parent))')
              p.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q backend evaluation app.py
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate repository structure'
          git push
