name: Document Chrome extension

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add extension context
        shell: bash
        run: |
          if grep -q '^## Chrome extension' README.md; then
            echo 'Chrome extension section already present'
            exit 0
          fi
          cat >> README.md <<'EOF'

## Chrome extension

The repository also contains a local-development Chrome extension in `extension/`. It is the browser-facing implementation of the Kivi layer described by the product vision: Kivi sits on top of the app you are already using, uses the current page and selection as context, and keeps the user in control.

The extension is intentionally a **secondary review surface**, not a replacement for the main local Kivi application. The main product and memory system remain documented in `RUN.md` and the sections above.

### What it adds

- **Where:** the user selects text on the current web page. Kivi uses that selection and the current site/app as context.
- **What:** the user gives an instruction by typing or browser speech input.
- **Understand:** the extension sends the request to the local Kivi backend at `http://127.0.0.1:8000/api/ask`.
- **Preview:** Kivi shows the proposed result before changing anything.
- **Apply:** only an explicit Apply action writes back to a safely editable target. If the target cannot be safely edited, the result can be copied instead.

Nothing is silently submitted, sent, posted, clicked, or changed on the user's behalf.

### Browser surfaces

The extension identifies common browser contexts including Gmail, Slack, WhatsApp Web, Notion, GitHub/VS Code web surfaces, Google Docs and Teams. Unknown pages are treated as generic Chrome context.

It also provides **Kivi Anywhere** through `Ctrl+Shift+K` on Windows/Linux and `Command+Shift+K` on macOS, when the browser allows the content script to run.

### Local setup

1. Start the Kivi backend from the repository root:
   ```
   python run.py
   ```
2. Open `chrome://extensions` in Chrome.
3. Enable **Developer mode**.
4. Choose **Load unpacked** and select the `extension/` folder.
5. Open a web app, select text, and press `Ctrl+Shift+K` or use the Kivi extension popup.

The extension is localhost-only in this development build. It does not require a remote account or API key.

### Important implementation notes

The extension uses browser speech recognition only as a development ASR surface. It is not Sarvam ASR and should not be presented as evidence of Kivi's final multilingual speech quality. Text input remains available when browser speech recognition is unavailable.

The extension deliberately preserves the product boundary from the memory implementation: it proposes changes and leaves the final transport to the user. It does not send messages or perform autonomous browser actions.

Google Docs has limited editing support because much of its editing surface is canvas-based rather than normal editable DOM.

See [`extension/README.md`](extension/README.md) for the extension-specific implementation and review instructions.
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Document Chrome extension'
          git push
